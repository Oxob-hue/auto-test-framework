[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --alluredir=allure-results --clean-alluredir --reruns 1 --reruns-delay 1 --only-rerun "(WebDriverException|TimeoutException|ConnectionError|ReadTimeout|RemoteDisconnected|MaxRetryError|ProxyError)"
markers =
    api: 接口自动化用例
    web: Web UI 自动化用例
    smoke: 冒烟测试（核心主流程）
    negative: 反向/异常场景
pythonpath = .

; 失败重试策略：仅对“基础设施类”异常（浏览器/驱动/网络抖动）自动重试 1 次，
; 断言类失败（AssertionError 等）不重试，避免用重试掩盖真实缺陷。
; 可在命令行临时覆盖，如：--reruns 0
;
; 并行示例（需 pip install pytest-xdist）：
;   python -m pytest tests -n 4       实测约 40s（修复稳健等待后；未加固前约 27s）
