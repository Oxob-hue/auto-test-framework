[web]
; SauceDemo 被测地址
base_url = https://www.saucedemo.com/
; 浏览器类型：edge 或 chrome（CI 中可用环境变量 TEST_WEB_BROWSER=chrome 覆盖）
browser = edge
; Edge 驱动路径（仅 browser=edge 时使用；chrome 交由 Selenium Manager 自动匹配驱动）
driver_path = D:\msedgedriver\msedgedriver.exe
; 是否无头模式（CI 或无界面环境建议 true）
headless = false
; 隐式等待（秒），元素查找兜底
implicit_wait = 10
; 显式等待（秒），页面对象等待元素
explicit_wait = 10
; 页面加载超时（秒）
page_load_timeout = 30

[api]
; Petstore 被测接口地址
base_url = https://petstore.swagger.io/v2
; 请求超时（秒）
timeout = 15

[log]
level = INFO
; 日志目录与文件（相对项目根目录）
dir = logs
file = test.log
